# Production Stack: Velox + Backup
#
# Usage:
#   docker compose up -d              # Start all services
#   docker compose logs -f velox      # Follow trading bot logs
#   docker compose exec velox python main.py --diagnose  # Run diagnostic
#
# The terminal dashboard is the interface:
#   docker attach velox-v12            # live dashboard (detach: Ctrl-P Ctrl-Q)
#   docker compose exec velox python velox.py status
#   docker compose exec velox python velox.py kill

services:
  velox:
    build: .
    container_name: velox-v12
    restart: unless-stopped
    stop_grace_period: 45s
    env_file: .env
    environment:
      - STRUCTURED_LOGGING=true
    tty: true          # Rich live dashboard needs a terminal
    stdin_open: true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./bot.db:/app/bot.db
    healthcheck:
      test: ["CMD", "python", "velox.py", "health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # Automated daily SQLite backups (bot.db copy, 30-day retention)
  backup:
    image: alpine:3
    container_name: velox-backup
    restart: unless-stopped
    volumes:
      - ./backups:/backups
      - ./bot.db:/app/bot.db:ro
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "Velox backup service started — daily at 02:00 UTC"
        while true; do
          # Sleep until next 02:00 UTC
          now=$$(date +%s)
          target=$$(date -d "tomorrow 02:00" +%s 2>/dev/null || date -d "02:00 tomorrow" +%s 2>/dev/null)
          # Fallback: just sleep 24h if date parsing fails
          sleep_secs=$${target:+$$((target - now))}
          sleep $${sleep_secs:-86400}

          ts=$$(date +%Y%m%d_%H%M%S)
          echo "[$$ts] Starting backups..."

          # SQLite backup (simple copy, safe for read-only mount)
          if [ -f /app/bot.db ]; then
            cp /app/bot.db "/backups/bot_$$ts.db" && \
              echo "[$$ts] SQLite backup OK" || \
              echo "[$$ts] SQLite backup FAILED"
          fi

          # Prune backups older than 30 days
          find /backups -name "bot_*.db" -mtime +30 -delete 2>/dev/null
          echo "[$$ts] Backup cycle complete"
        done
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
